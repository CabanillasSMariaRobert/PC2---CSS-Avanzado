<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Califica 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Práctica Calificada 2</h1>
    </header>
    <main>
        <section class="lista-alertas">
            <h2>Alertas</h2>
            <ul class="alerts">
                <li class="alert-info">Alerta 1</li>
                <li class="alert-success">Alerta 2</li>
                <li class="alert-warning">Alerta 3</li>
                <li class="alert-danger">Alerta 4</li>
            </ul>
        </section>
        <section class="tarjetas-precio">
            <h2>Tarjetas de precio</h2>
            <div class="cards">
                <div class="card-1">
                    <h3>Plan mejorado</h3>
                    <p>20.00</p>
                    <button>Comprar</button>
                </div>
                <div class="card-2">
                    <h3>Plan premium</h3>
                    <p>50.00</p>
                    <button>Comprar</button>
                </div>
                <div class="card-3">
                    <h3>Plan empresarial</h3>
                    <p>150.00</p>
                    <button>Comprar</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
